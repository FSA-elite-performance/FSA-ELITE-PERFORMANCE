name: Link Check (static export)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          cd next-app
          npm ci
      - name: Build (standard)
        run: |
          cd next-app
          npm run build
      - name: Static export (NEXT_EXPORT=1)
        run: |
          cd next-app
          node scripts/export-build.js
      - name: Link check (linkinator)
        run: |
          npm install -g linkinator
          cd next-app
          npx linkinator ./out --skipExternal
