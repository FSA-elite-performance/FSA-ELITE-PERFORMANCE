name: Build and Deploy Next.js (static export) to GitHub Pages

# NOTE: GitHub Pages is a static host only.
# The serverless API route at next-app/pages/api/create-checkout-session.ts
# will NOT work on GitHub Pages. Use Vercel (or any Node-capable host) for
# Stripe Checkout and other serverless endpoints.
# This workflow exports static pages only as a fallback / landing page.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: |
          cd next-app
          npm ci

      - name: Build static export for Pages
        run: |
          cd next-app
          npm run build
        env:
          # OUTPUT_EXPORT=1 enables `output: 'export'` in next.config.js so
          # Next.js writes a full static site to ./out instead of a serverless build.
          # STRIPE_SECRET_KEY is intentionally omitted — API routes are excluded from static export.
          OUTPUT_EXPORT: '1'
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://fsaeliteperformance-arch.github.io/FSA-ELITE-SALES-TRAINING' }}
          PRICE_AMOUNT_CENTS: '1999'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./next-app/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
