name: Deploy to GitHub Pages (Static Export)

# NOTE: GitHub Pages is static-only.
# The serverless /api/create-checkout-session route WILL NOT work on Pages.
# For full Stripe Checkout functionality, deploy to Vercel (recommended).
# See README.md for Vercel deployment instructions.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: next-app
        run: npm ci

      - name: Build and export Next.js app
        working-directory: next-app
        env:
          # NEXT_EXPORT=1 tells next.config.js to enable `output: 'export'` for static generation.
          # See next-app/next.config.js for the conditional logic.
          NEXT_EXPORT: "1"
          # Required: set these as GitHub repository secrets or variables.
          # The STRIPE_SECRET_KEY is server-side only; it is NOT embedded in the static output.
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://fsaeliteperformance.com' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js static export outputs to /out by default when output:'export' is set
          path: next-app/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
