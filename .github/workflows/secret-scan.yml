name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  secret-pattern-scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan for private key blocks and common credential patterns
        run: |
          set -euo pipefail

              if git grep -I -nE \
                -e '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----' \
                -e '-----BEGIN PRIVATE KEY-----' \
                -e '-----BEGIN ENCRYPTED PRIVATE KEY-----' \
                -e 'AKIA[0-9A-Z]{16}' \
                -e 'ASIA[0-9A-Z]{16}' \
                -e 'ghp_[A-Za-z0-9]{36}' \
                -e 'github_pat_[A-Za-z0-9_]{20,255}' \
                -e 'sk_live_[0-9A-Za-z]{16,}' \
                -e 'rk_live_[0-9A-Za-z]{16,}' \
                -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
                -e 'AIza[0-9A-Za-z\-_]{35}' \
                -e 'sk-[A-Za-z0-9]{20,}' \
                -e '-----BEGIN (PGP|OPENSSH) PRIVATE KEY BLOCK-----' \
                -- . ':(exclude).github/workflows/secret-scan.yml' ':(exclude)*.mhtml' ':(exclude)README.md' ':(exclude).env.example'; then
                echo "Error: committed secret-like material detected."
                exit 1
              fi

          echo "No secret-like patterns detected."
