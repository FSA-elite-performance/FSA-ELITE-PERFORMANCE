name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-key-scan:
    name: Detect committed private keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for private key blocks
        run: |
          set -euo pipefail

          if git grep -I -nE \
            -e '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----' \
            -e '-----BEGIN PRIVATE KEY-----' \
            -e '-----BEGIN ENCRYPTED PRIVATE KEY-----' \
            -- . ':(exclude).github/workflows/secret-scan.yml'; then
            echo "Error: committed private key material detected."
            exit 1
          fi

          echo "No private key blocks detected."
