name: Validate HTML

on:
  pull_request:
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/html-validate.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/html-validate.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  htmlhint:
    name: Validate HTML structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run HTMLHint
        run: npx --yes htmlhint --config .htmlhintrc index.html
