<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oliveTitle oliveDesc">
  <title id="oliveTitle">OLIVE — FSA ELITE Performance AI</title>
  <desc id="oliveDesc">Premium OLIVE wordmark for the FSA ELITE Performance sales training bot. An olive leaf grows from the upper right of the O letterform. Olive-to-gold gradient with a subtle FSA reference.</desc>

  <defs>
    <!-- Primary olive-to-gold gradient (left to right across the wordmark) -->
    <linearGradient id="oliveGrad" x1="60" y1="140" x2="820" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#5C6E42"/>
      <stop offset="0.30" stop-color="#748654"/>
      <stop offset="0.58" stop-color="#9E9252"/>
      <stop offset="0.82" stop-color="#BFA05A"/>
      <stop offset="1"    stop-color="#CAA15F"/>
    </linearGradient>

    <!-- Leaf gradient (gold tip fading into olive body) -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#CAA15F"/>
      <stop offset="0.5" stop-color="#8B9A58"/>
      <stop offset="1"   stop-color="#5C6E42"/>
    </linearGradient>

    <!-- Leaf vein highlight -->
    <linearGradient id="veinGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Accent line under letterforms -->
    <linearGradient id="lineGrad" x1="60" y1="0" x2="830" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#5C6E42"/>
      <stop offset="0.5" stop-color="#9E9252"/>
      <stop offset="1"   stop-color="#CAA15F"/>
    </linearGradient>

    <!-- Metallic sheen overlay for luxury depth -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════
       O LETTERFORM — geometric circle with integrated olive leaf
       ═══════════════════════════════════════════════════════════════════════ -->
  <g id="letter-O">
    <!-- Main O ring -->
    <circle cx="128" cy="172" r="68" stroke="url(#oliveGrad)" stroke-width="22" fill="none"/>
    <!-- Subtle inner highlight ring -->
    <circle cx="128" cy="172" r="56" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" fill="none"/>

    <!-- Olive leaf — grows organically from upper-right of the O -->
    <path d="M178 118
             C192 104, 214 100, 228 110
             C236 126, 226 150, 210 162
             C200 170, 186 168, 178 160
             C168 148, 168 132, 178 118Z"
          fill="url(#leafGrad)" opacity="0.92"/>

    <!-- Leaf central vein -->
    <path d="M182 122 C196 134, 210 148, 216 158"
          stroke="url(#veinGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Secondary leaf veins -->
    <path d="M190 126 C194 134, 196 140, 196 146"
          stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.0" stroke-linecap="round" fill="none"/>
    <path d="M198 130 C204 138, 208 146, 208 154"
          stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.0" stroke-linecap="round" fill="none"/>

    <!-- Tiny stem connecting leaf to the O stroke -->
    <path d="M176 126 C178 122, 180 119, 182 118"
          stroke="#748654" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════
       L-I-V-E LETTERFORMS — Sora geometric sans, tracked wide
       Uses <text> for crisp rendering with the site's own brand font.
       ═══════════════════════════════════════════════════════════════════════ -->
  <text x="246" y="212"
        font-family="'Sora', 'Montserrat', 'Inter', system-ui, sans-serif"
        font-size="128"
        font-weight="800"
        letter-spacing="0.14em"
        fill="url(#oliveGrad)">LIVE</text>

  <!-- Metallic sheen on LIVE text -->
  <text x="246" y="212"
        font-family="'Sora', 'Montserrat', 'Inter', system-ui, sans-serif"
        font-size="128"
        font-weight="800"
        letter-spacing="0.14em"
        fill="url(#sheen)">LIVE</text>

  <!-- ═══════════════════════════════════════════════════════════════════════
       ACCENT LINE — thin gradient rule beneath the wordmark
       ═══════════════════════════════════════════════════════════════════════ -->
  <line x1="62" y1="238" x2="830" y2="238"
        stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" opacity="0.70"/>

  <!-- Highlight on accent line -->
  <line x1="62" y1="237" x2="830" y2="237"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════════════════════════════════
       FSA REFERENCE — small, quiet, upper-right corner
       ═══════════════════════════════════════════════════════════════════════ -->
  <text x="830" y="108"
        text-anchor="end"
        font-family="'Sora', 'Montserrat', 'Inter', system-ui, sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="0.32em"
        fill="#1A1A2E"
        opacity="0.52">FSA</text>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SUBTITLE — Elite Performance AI descriptor
       ═══════════════════════════════════════════════════════════════════════ -->
  <text x="830" y="268"
        text-anchor="end"
        font-family="'Sora', 'Montserrat', 'Inter', system-ui, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="0.28em"
        fill="#5A6778">ELITE PERFORMANCE AI</text>
</svg>